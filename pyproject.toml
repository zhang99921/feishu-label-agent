[project]
name = "feishu-feasibility"
version = "1.0.0"
description = "Feishu inventory HTTP backend with optional future MCP adapters"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "uvicorn>=0.30,<1",
]

[project.scripts]
finding-assistant-api = "finding_assistant.interfaces.http.__main__:main"
finding-assistant-catalog = "finding_assistant.servers.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finding_assistant"]
